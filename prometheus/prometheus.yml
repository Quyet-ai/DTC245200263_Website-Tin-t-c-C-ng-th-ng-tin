global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor-containers'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'mysql-database'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  - job_name: 'nginx-web'
    static_configs:
      - targets: ['nginx-exporter:9113']
